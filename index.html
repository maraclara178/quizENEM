<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz ENEM | Ranking e Placar</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --roxo-claro: #6d28d9;
            --roxo-neon: #a855f7;
            --roxo-brilho: #c084fc;
            --preto: #0a0a0a;
            --branco: #ffffff;
            --verde: #10b981;
            --vermelho: #ef4444;
            --dourado: #f59e0b;
            --prata: #94a3b8;
            --bronze: #d97706;
            --glass: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', 'Segoe UI', sans-serif;
            background: var(--preto);
            min-height: 100vh;
            padding: 20px;
            color: var(--branco);
            background-image: 
                radial-gradient(ellipse at 20% 50%, rgba(109, 40, 217, 0.15) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 20%, rgba(168, 85, 247, 0.1) 0%, transparent 50%);
        }

        .container {
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
        }

        .main-container {
            background: rgba(17, 17, 17, 0.9);
            backdrop-filter: blur(40px);
            border-radius: 30px;
            padding: 40px 30px;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.8), 0 0 0 2px rgba(168, 85, 247, 0.3);
            border: 2px solid rgba(168, 85, 247, 0.3);
            margin-bottom: 30px;
        }

        h1 {
            text-align: center;
            font-size: 2.5em;
            font-weight: 900;
            background: linear-gradient(135deg, var(--roxo-brilho), var(--roxo-neon));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 30px;
        }

        .divider {
            width: 60px;
            height: 3px;
            background: linear-gradient(90deg, var(--roxo-claro), var(--roxo-neon));
            margin: 0 auto 30px;
            border-radius: 10px;
        }

        .name-input-wrapper {
            position: relative;
            margin-bottom: 20px;
        }

        .name-input-wrapper input {
            width: 100%;
            padding: 18px 25px;
            border-radius: 50px;
            border: 2px solid rgba(168, 85, 247, 0.4);
            background: rgba(255, 255, 255, 0.05);
            color: white;
            font-size: 1.2em;
            font-family: 'Inter', sans-serif;
            outline: none;
            text-align: center;
            transition: all 0.3s;
        }

        .name-input-wrapper input:focus {
            border-color: var(--roxo-neon);
            box-shadow: 0 0 30px rgba(168, 85, 247, 0.3);
        }

        .name-input-wrapper input::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        .hint {
            text-align: center;
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.9em;
            margin-top: 10px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }

        button {
            width: 100%;
            padding: 16px;
            border-radius: 50px;
            font-weight: 700;
            font-size: 1.1em;
            cursor: pointer;
            border: none;
            font-family: 'Inter', sans-serif;
            margin: 8px 0;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s;
        }

        .btn-area {
            background: rgba(255, 255, 255, 0.05);
            color: white;
            text-align: left;
            padding: 20px;
            border-radius: 20px;
            border: 2px solid rgba(255, 255, 255, 0.1);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 15px;
            text-transform: none;
            letter-spacing: 0;
        }

        .btn-area:hover {
            background: rgba(168, 85, 247, 0.15);
            border-color: var(--roxo-neon);
            transform: translateX(10px);
        }

        .btn-area .icon {
            font-size: 2.5em;
        }

        .btn-area .name {
            font-size: 1.1em;
            color: var(--roxo-brilho);
            font-weight: 600;
        }

        .btn-area .desc {
            font-size: 0.8em;
            color: rgba(255, 255, 255, 0.5);
        }

        .btn-option {
            background: rgba(255, 255, 255, 0.05);
            color: white;
            text-align: left;
            padding: 15px 20px;
            border-radius: 15px;
            border: 2px solid rgba(255, 255, 255, 0.1);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 12px;
            text-transform: none;
            letter-spacing: 0;
            font-weight: 500;
        }

        .btn-option:hover:not(:disabled) {
            background: rgba(168, 85, 247, 0.15);
            border-color: var(--roxo-neon);
            transform: translateX(5px);
        }

        .btn-option:disabled {
            cursor: not-allowed;
        }

        .btn-option.correct {
            background: rgba(16, 185, 129, 0.3) !important;
            border-color: var(--verde) !important;
            color: #6ee7b7 !important;
        }

        .btn-option.wrong {
            background: rgba(239, 68, 68, 0.3) !important;
            border-color: var(--vermelho) !important;
            color: #fca5a5 !important;
        }

        .letter {
            background: rgba(255, 255, 255, 0.15);
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            flex-shrink: 0;
        }

        .btn-voltar {
            background: transparent;
            border: 2px solid rgba(255, 255, 255, 0.2);
            color: rgba(255, 255, 255, 0.7);
        }

        .btn-finish {
            background: linear-gradient(135deg, #059669, #10b981) !important;
            color: white !important;
        }

        .btn-next {
            background: linear-gradient(135deg, var(--roxo-claro), #7c3aed) !important;
            color: white !important;
        }

        .question-card {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 20px;
            padding: 25px;
            margin: 20px 0;
            border: 2px solid rgba(255, 255, 255, 0.08);
        }

        .question-text {
            font-size: 1.15em;
            line-height: 1.6;
        }

        .feedback {
            text-align: center;
            padding: 15px;
            border-radius: 15px;
            font-weight: 600;
            margin: 15px 0;
            display: none;
        }

        .feedback.show {
            display: block;
        }

        .feedback.correct {
            background: rgba(16, 185, 129, 0.2);
            color: #6ee7b7;
        }

        .feedback.wrong {
            background: rgba(239, 68, 68, 0.2);
            color: #fca5a5;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            margin: 15px 0;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--roxo-claro), var(--roxo-neon));
            width: 0%;
            transition: width 0.5s;
        }

        .quiz-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            color: var(--roxo-brilho);
            font-weight: 600;
        }

        .timer {
            text-align: center;
            font-size: 1.2em;
            color: var(--roxo-brilho);
            margin: 10px 0;
        }

        .result-score {
            font-size: 3.5em;
            font-weight: 900;
            text-align: center;
            background: linear-gradient(135deg, #fff, var(--roxo-brilho));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 20px 0;
        }

        .result-emoji {
            font-size: 5em;
            text-align: center;
        }

        .btn-group {
            display: flex;
            gap: 10px;
        }

        .btn-group button {
            flex: 1;
        }

        .user-info {
            text-align: center;
            margin-bottom: 20px;
            color: var(--roxo-brilho);
            font-weight: 600;
            font-size: 1.1em;
        }

        /* PLACAR */
        .leaderboard {
            background: rgba(17, 17, 17, 0.9);
            backdrop-filter: blur(40px);
            border-radius: 30px;
            padding: 35px;
            border: 2px solid rgba(168, 85, 247, 0.3);
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.8);
        }

        .leaderboard h2 {
            text-align: center;
            font-size: 2em;
            font-weight: 800;
            background: linear-gradient(135deg, var(--dourado), #fbbf24);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 25px;
        }

        .leaderboard-table {
            width: 100%;
            border-collapse: collapse;
        }

        .leaderboard-table th {
            text-align: left;
            padding: 12px 15px;
            color: rgba(255, 255, 255, 0.5);
            font-weight: 500;
            font-size: 0.9em;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .leaderboard-table td {
            padding: 14px 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            font-size: 0.95em;
        }

        .leaderboard-table tr:hover td {
            background: rgba(255, 255, 255, 0.03);
        }

        .rank-badge {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.85em;
        }

        .rank-1 { background: var(--dourado); color: black; }
        .rank-2 { background: var(--prata); color: black; }
        .rank-3 { background: var(--bronze); color: white; }
        .rank-other { background: rgba(255, 255, 255, 0.1); color: white; }

        @media (max-width: 650px) {
            .main-container, .leaderboard {
                padding: 25px 15px;
            }
            h1 {
                font-size: 2em;
            }
            .btn-group {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="main-container">
            <h1>🎯 Quiz ENEM</h1>
            <p class="subtitle">Teste seus conhecimentos e suba no ranking!</p>
            <div class="divider"></div>

            <!-- TELA 1: NOME -->
            <div id="screenName">
                <div class="name-input-wrapper">
                    <input type="text" id="inputName" placeholder="Digite seu nome e pressione Enter..." maxlength="30" autocomplete="off">
                    <p class="hint">Pressione ENTER para começar ⏎</p>
                </div>
            </div>

            <!-- TELA 2: ÁREAS -->
            <div id="screenAreas" style="display:none;">
                <div class="user-info">
                    👋 Bem-vindo(a), <span id="displayName"></span>!
                </div>
                <div id="areasContainer"></div>
                <button class="btn-voltar" id="btnSair" style="margin-top:15px;">SAIR</button>
            </div>

            <!-- TELA 3: QUIZ -->
            <div id="screenQuiz" style="display:none;">
                <div class="quiz-header">
                    <span id="quizAreaName"></span>
                    <span id="questionCounter"></span>
                </div>
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
                <div class="timer" id="timerDisplay">⏱️ 00:00</div>
                <div class="question-card">
                    <p class="question-text" id="questionText"></p>
                </div>
                <div id="optionsContainer"></div>
                <div class="feedback" id="feedback"></div>
                <div class="btn-group">
                    <button class="btn-voltar" id="btnDesistir">DESISTIR</button>
                    <button class="btn-next" id="btnNext" style="display:none;">PRÓXIMA ➡️</button>
                    <button class="btn-finish" id="btnFinish" style="display:none;">FINALIZAR 🏁</button>
                </div>
            </div>

            <!-- TELA 4: RESULTADO -->
            <div id="screenResult" style="display:none;">
                <div class="result-emoji" id="resultEmoji"></div>
                <div class="result-score" id="resultScoreValue"></div>
                <p style="font-size:1.2em; text-align:center; margin:15px 0;" id="resultMessage"></p>
                <p style="text-align:center; color:var(--roxo-brilho);" id="resultTime"></p>
                <div class="btn-group" style="margin-top:20px;">
                    <button class="btn-next" id="btnRestart">REFAZER</button>
                    <button class="btn-voltar" id="btnNewArea">NOVA ÁREA</button>
                </div>
            </div>
        </div>

        <!-- PLACAR -->
        <div class="leaderboard">
            <h2>🏆 Ranking dos Jogadores</h2>
            <div style="overflow-x: auto;">
                <table class="leaderboard-table">
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Jogador</th>
                            <th>Área</th>
                            <th>Pontos</th>
                            <th>Tempo</th>
                            <th>Data</th>
                        </tr>
                    </thead>
                    <tbody id="leaderboardBody">
                        <tr>
                            <td colspan="6" style="text-align:center; color:rgba(255,255,255,0.5);">Carregando ranking...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

        let playerName = '';

        // ============================================
        // FUNÇÕES DE NAVEGAÇÃO
        // ============================================
        function showScreen(screenId) {
            ['screenName', 'screenAreas', 'screenQuiz', 'screenResult'].forEach(id => {
                document.getElementById(id).style.display = 'none';
            });
            document.getElementById(screenId).style.display = 'block';
        }

        // ============================================
        // CARREGAR PLACAR
        // ============================================
        async function carregarPlacar() {
            const tbody = document.getElementById('leaderboardBody');
            
            // Tenta carregar do Supabase
            if (supabaseClient) {
                try {
                    const { data, error } = await supabaseClient
                        .from('scores')
                        .select('*')
                        .order('score', { ascending: false })
                        .limit(20);

                    if (!error && data) {
                        scores = data;
                    }
                } catch (e) {
                    console.log('Usando placar local');
                }
            }

            // Se não tiver dados do Supabase, usa localStorage
            if (scores.length === 0) {
                const saved = localStorage.getItem('quizScores');
                scores = saved ? JSON.parse(saved) : [];
            }

            renderizarPlacar();
        }

        function renderizarPlacar() {
            const tbody = document.getElementById('leaderboardBody');
            
            if (scores.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" style="text-align:center; padding:30px; color:rgba(255,255,255,0.5);">Nenhuma pontuação ainda. Seja o primeiro!</td></tr>';
                return;
            }

            // Ordena por pontuação e tempo
            const sorted = [...scores].sort((a, b) => {
                if (b.score !== a.score) return b.score - a.score;
                return a.time_seconds - b.time_seconds;
            });

            const areaNames = {
                linguagens: '📚 Linguagens',
                matematica: '🔢 Matemática',
                natureza: '🔬 Natureza',
                humanas: '🌍 Humanas'
            };

            tbody.innerHTML = sorted.slice(0, 20).map((entry, i) => {
                const rank = i + 1;
                let rankClass = 'rank-other';
                if (rank === 1) rankClass = 'rank-1';
                else if (rank === 2) rankClass = 'rank-2';
                else if (rank === 3) rankClass = 'rank-3';

                const mins = Math.floor(entry.time_seconds / 60);
                const secs = entry.time_seconds % 60;
                const timeStr = `${mins}:${secs.toString().padStart(2, '0')}`;
                const date = entry.created_at ? new Date(entry.created_at).toLocaleDateString('pt-BR') : '-';

                return `
                    <tr>
                        <td><span class="rank-badge ${rankClass}">${rank}</span></td>
                        <td style="font-weight:600;">${entry.player_name || 'Anônimo'}</td>
                        <td>${areaNames[entry.area] || entry.area}</td>
                        <td style="color:var(--verde); font-weight:700;">${entry.score} pts</td>
                        <td>⏱️ ${timeStr}</td>
                        <td style="color:rgba(255,255,255,0.5);">${date}</td>
                    </tr>
                `;
            }).join('');
        }

        // ============================================
        // SALVAR PONTUAÇÃO
        // ============================================
        async function salvarPontuacao(finalScore) {
            const scoreData = {
                player_name: playerName,
                area: currentArea,
                score: finalScore,
                correct_answers: score,
                total_questions: 10,
                time_seconds: seconds,
                created_at: new Date().toISOString()
            };

            // Tenta salvar no Supabase
            if (supabaseClient) {
                try {
                    const { error } = await supabaseClient
                        .from('scores')
                        .insert([scoreData]);
                    
                    if (!error) {
                        console.log('✅ Pontuação salva no Supabase');
                        scores.unshift(scoreData);
                        renderizarPlacar();
                        return;
                    }
                } catch (e) {
                    console.log('Salvando localmente...');
                }
            }

            // Salva no localStorage como fallback
            scores.unshift(scoreData);
            localStorage.setItem('quizScores', JSON.stringify(scores));
            renderizarPlacar();
        }

        // ============================================
        // EVENTO DO INPUT DE NOME
        // ============================================
        document.getElementById('inputName').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                const name = this.value.trim();
                if (!name) {
                    alert('⚠️ Digite seu nome para começar!');
                    return;
                }
                playerName = name;
                document.getElementById('displayName').textContent = playerName;
                renderizarAreas();
                showScreen('screenAreas');
            }
        });

        document.getElementById('inputName').focus();

        // ============================================
        // OUTROS EVENTOS
        // ============================================
        document.getElementById('btnSair').addEventListener('click', sairQuiz);
        document.getElementById('btnDesistir').addEventListener('click', desistirQuiz);
        document.getElementById('btnNext').addEventListener('click', proximaPergunta);
        document.getElementById('btnFinish').addEventListener('click', finalizarQuiz);
        document.getElementById('btnRestart').addEventListener('click', refazerQuiz);
        document.getElementById('btnNewArea').addEventListener('click', novaArea);

        function sairQuiz() {
            if (confirm('Sair?')) {
                playerName = '';
                document.getElementById('inputName').value = '';
                document.getElementById('inputName').focus();
                showScreen('screenName');
            }
        }

        function renderizarAreas() {
            const areas = [
                { id: 'linguagens', icon: '📚', name: 'Linguagens, Códigos e suas Tecnologias', desc: 'Português, Literatura, Inglês, Espanhol, Artes, Educação Física' },
                { id: 'matematica', icon: '🔢', name: 'Matemática e suas Tecnologias', desc: 'Matemática' },
                { id: 'natureza', icon: '🔬', name: 'Ciências da Natureza e suas Tecnologias', desc: 'Biologia, Química, Física' },
                { id: 'humanas', icon: '🌍', name: 'Ciências Humanas e Sociais Aplicadas', desc: 'Geografia, História, Filosofia, Sociologia' }
            ];

            document.getElementById('areasContainer').innerHTML = areas.map(area => `
                <button class="btn-area" data-area="${area.id}">
                    <span class="icon">${area.icon}</span>
                    <span>
                        <div class="name">${area.name}</div>
                        <div class="desc">${area.desc}</div>
                    </span>
                </button>
            `).join('');

            document.querySelectorAll('.btn-area').forEach(btn => {
                btn.addEventListener('click', () => iniciarQuiz(btn.dataset.area));
            });
        }

        function iniciarQuiz(area) {
            currentArea = area;
            currentQuestions = [...LOCAL_DB[area]].sort(() => Math.random() - 0.5);
            currentIndex = 0;
            score = 0;
            answered = false;
            seconds = 0;

            const areaNames = {
                linguagens: '📚 Linguagens',
                matematica: '🔢 Matemática',
                natureza: '🔬 Natureza',
                humanas: '🌍 Humanas'
            };

            document.getElementById('quizAreaName').textContent = areaNames[area];
            showScreen('screenQuiz');
            iniciarTimer();
            carregarPergunta();
        }

        function iniciarTimer() {
            clearInterval(timerInterval);
            const startTime = Date.now();
            timerInterval = setInterval(() => {
                seconds = Math.floor((Date.now() - startTime) / 1000);
                const mins = Math.floor(seconds / 60).toString().padStart(2, '0');
                const secs = (seconds % 60).toString().padStart(2, '0');
                document.getElementById('timerDisplay').textContent = `⏱️ ${mins}:${secs}`;
            }, 1000);
        }

        function pararTimer() {
            clearInterval(timerInterval);
        }

        function carregarPergunta() {
            const q = currentQuestions[currentIndex];
            document.getElementById('questionText').textContent = q.question;
            document.getElementById('questionCounter').textContent = `${currentIndex + 1}/10`;
            document.getElementById('progressFill').style.width = `${(currentIndex / 10) * 100}%`;

            const letters = ['A', 'B', 'C', 'D', 'E'];
            document.getElementById('optionsContainer').innerHTML = q.options.map((opt, i) => `
                <button class="btn-option" data-index="${i}">
                    <span class="letter">${letters[i]}</span>${opt}
                </button>
            `).join('');

            document.querySelectorAll('.btn-option').forEach(btn => {
                btn.addEventListener('click', () => selecionarResposta(parseInt(btn.dataset.index)));
            });

            document.getElementById('feedback').className = 'feedback';
            document.getElementById('btnNext').style.display = 'none';
            document.getElementById('btnFinish').style.display = 'none';
            answered = false;
        }

        function selecionarResposta(idx) {
            if (answered) return;
            answered = true;

            const q = currentQuestions[currentIndex];
            const buttons = document.querySelectorAll('.btn-option');
            buttons.forEach((btn, i) => {
                btn.disabled = true;
                if (i === q.correct) btn.classList.add('correct');
                if (i === idx && i !== q.correct) btn.classList.add('wrong');
            });

            const feedback = document.getElementById('feedback');
            if (idx === q.correct) {
                score++;
                feedback.textContent = '✅ Resposta correta!';
                feedback.className = 'feedback correct show';
            } else {
                feedback.textContent = '❌ Resposta incorreta';
                feedback.className = 'feedback wrong show';
            }

            if (currentIndex === 9) {
                document.getElementById('btnFinish').style.display = 'block';
            } else {
                document.getElementById('btnNext').style.display = 'block';
            }
        }

        function proximaPergunta() {
            if (currentIndex < 9) {
                currentIndex++;
                carregarPergunta();
            }
        }

        async function finalizarQuiz() {
            pararTimer();
            const finalScore = Math.round((score / 10) * 100);
            
            // Salva no placar
            await salvarPontuacao(finalScore);
            
            document.getElementById('resultScoreValue').textContent = `${finalScore} pts`;

            const mins = Math.floor(seconds / 60);
            const secs = seconds % 60;
            document.getElementById('resultTime').textContent = `⏱️ Tempo: ${mins}:${secs.toString().padStart(2, '0')}`;

            let emoji, msg;
            if (finalScore >= 90) { emoji = '🏆'; msg = 'Excelente! Você é um expert!'; }
            else if (finalScore >= 70) { emoji = '✨'; msg = 'Muito bom! Continue assim!'; }
            else if (finalScore >= 50) { emoji = '📖'; msg = 'Continue estudando!'; }
            else { emoji = '💪'; msg = 'Não desista! Pratique mais!'; }

            document.getElementById('resultEmoji').textContent = emoji;
            document.getElementById('resultMessage').textContent = msg;
            showScreen('screenResult');
        }

        function desistirQuiz() {
            if (confirm('Desistir? Seu progresso será perdido.')) {
                pararTimer();
                showScreen('screenAreas');
            }
        }

        function refazerQuiz() {
            iniciarQuiz(currentArea);
        }

        function novaArea() {
            pararTimer();
            showScreen('screenAreas');
        }

        // Carrega o placar ao iniciar
        carregarPlacar();
    </script>
</body>
</html>
